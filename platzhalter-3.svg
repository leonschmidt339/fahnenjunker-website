function download(name, content, type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function icsDate(date,time){return (date.replaceAll('-','')+'T'+(time||'09:00').replace(':','')+'00')}function makeICS(events){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fahnenjunker//Termine//DE','CALSCALE:GREGORIAN'];events.forEach((e,i)=>{lines.push('BEGIN:VEVENT','UID:fahnenjunker-'+e.date+'-'+i+'@fahnenjunker.de','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART:'+icsDate(e.date,e.time),'SUMMARY:'+e.title.replace(/,/g,'\\,'),'LOCATION:'+(e.location||'').replace(/,/g,'\\,'),'DESCRIPTION:'+(e.description||'').replace(/\n/g,'\\n').replace(/,/g,'\\,'),'END:VEVENT')});lines.push('END:VCALENDAR');return lines.join('\r\n')}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('saveGallery').onclick=()=>download('gallery.json',document.getElementById('galleryJson').value);document.getElementById('saveEvents').onclick=()=>{const txt=document.getElementById('eventsJson').value;download('events.json',txt);download('fahnenjunker-termine.ics',makeICS(JSON.parse(txt)),'text/calendar')};fetch('data/gallery.json').then(r=>r.text()).then(t=>galleryJson.value=t);fetch('data/events.json').then(r=>r.text()).then(t=>eventsJson.value=t);});
