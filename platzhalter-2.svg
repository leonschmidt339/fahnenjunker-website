function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});}async function loadEvents(){const el=document.getElementById('events');try{const res=await fetch('data/events.json');const events=(await res.json()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));el.innerHTML=events.map(ev=>`<article class="event"><div class="event-date">${fmt(ev.date)}<br>${ev.time||''}</div><div><h2>${ev.title}</h2><p><strong>Ort:</strong> ${ev.location||'wird bekanntgegeben'}</p><p>${ev.description||''}</p></div></article>`).join('');}catch(e){el.innerHTML='<p>Termine konnten lokal nicht geladen werden. Bitte über einen lokalen Server öffnen oder JSON prüfen.</p>';}}loadEvents();
