async function loadGallery(){const el=document.getElementById('gallery');try{const res=await fetch('data/gallery.json');const items=await res.json();el.innerHTML=items.map(item=>`<article class="gallery-item"><img src="${item.image}" alt="${item.title}"><div><h2>${item.title}</h2><p>${item.text}</p></div></article>`).join('');}catch(e){el.innerHTML='<p>Galerie konnte lokal nicht geladen werden. Bitte über einen lokalen Server öffnen oder JSON prüfen.</p>';}}loadGallery();
